name: TailorHub CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage gate
        run: npm run test:ci

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'coverage/coverage-summary.json';

            if (!fs.existsSync(path)) {
              core.warning('coverage-summary.json was not found. Skipping PR comment.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const total = report.total;
            const body = [
              '## Coverage Report',
              '',
              `- Statements: ${total.statements.pct}%`,
              `- Branches: ${total.branches.pct}%`,
              `- Functions: ${total.functions.pct}%`,
              `- Lines: ${total.lines.pct}%`,
              '',
              'Policy: 100% required in all metrics.'
            ].join('\n');

            const marker = '<!-- tailorhub-coverage-comment -->';
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: payload
              });
            }

      - name: Build application
        run: npm run build
