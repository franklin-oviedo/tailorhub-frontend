<div class="auth-page">

  <!-- Panel visual -->
  <section
    class="mannequin-panel"
    aria-label="TailorHub"
  >
    <img
      ngSrc="maniqui.png"
      width="350"
      height="550"
      priority
      alt="Maniquí masculino con traje de sastrería"
      class="mannequin-image"
    />
  </section>

  <!-- Panel de recuperación -->
  <section class="auth-panel">

    <div class="auth-card">

      <!-- Header -->
      <div class="auth-head">

        <img
          ngSrc="tailorhub.png"
          width="280"
          height="72"
          priority
          alt="TailorHub"
          class="auth-logo"
        />

        <h1>
          ¿Olvidaste tu contraseña?
        </h1>

        <p class="subtitle">
          Ingresa tu correo electrónico y te enviaremos
          las instrucciones para recuperar tu contraseña.
        </p>

      </div>

      <!-- Form -->
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="auth-form"
        novalidate
      >

        <div class="form-group">

          <div class="form-floating">

            <input
              id="forgotEmail"
              type="email"
              class="form-control th-input"
              [class.is-invalid]="isInvalid('email')"
              [class.is-valid]="isValid('email')"
              formControlName="email"
              placeholder="correo@tailorhub.com"
              autocomplete="email"
            />

            <label for="forgotEmail">
              Correo electrónico
            </label>

          </div>

          @if (isInvalid('email')) {
            <div
              class="invalid-feedback d-block"
              role="alert"
            >
              Ingresa un correo electrónico válido.
            </div>
          }

        </div>

        <!-- Success -->
        @if (message()) {
          <ngb-alert
            type="success"
            [dismissible]="false"
            class="auth-alert"
          >
            {{ message() }}
          </ngb-alert>
        }

        <!-- Error -->
        @if (errorMessage()) {
          <ngb-alert
            type="danger"
            [dismissible]="false"
            class="auth-alert"
          >
            {{ errorMessage() }}
          </ngb-alert>
        }

        <!-- Submit -->
        <button
          type="submit"
          class="btn th-btn-primary"
          [disabled]="form.invalid || loading()"
        >

          @if (loading()) {
            <span
              class="spinner-border spinner-border-sm me-2"
              aria-hidden="true"
            ></span>

            Enviando...
          } @else {
            Enviar instrucciones
          }

        </button>

      </form>

      <!-- Back to login -->
      <a
        routerLink="/login"
        class="link"
      >
        Volver a iniciar sesión
      </a>

    </div>

  </section>

</div>
